<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada | Henia</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#D1BF84;--charcoal:#282B30;--purple:#604685;--purple-dark:#4E396B;
    --font:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(155deg,#4E396B,#2f2444);color:#fff;text-align:center;padding:24px}
  .box{max-width:520px}
  img{height:44px;margin:0 auto 34px;display:block}
  .code{font-size:clamp(72px,16vw,130px);font-weight:800;line-height:1;letter-spacing:-4px;color:var(--gold)}
  h1{font-size:clamp(22px,4vw,30px);font-weight:800;margin:8px 0 14px}
  p{color:#d8cfe8;font-size:16px;line-height:1.6;margin-bottom:30px}
  a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--charcoal);
    border-radius:999px;padding:15px 30px;font-weight:700;text-decoration:none;transition:.18s}
  a.btn:hover{filter:brightness(.96);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/logo/titulo-white.png" alt="Henia" />
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>Lo sentimos, la página que buscas no existe o se ha movido. Volvamos a un lugar seguro.</p>
    <a class="btn" href="/">← Volver al inicio</a>
  </div>
</body>
</html>
